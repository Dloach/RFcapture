; Clean-room NFC-A emulation for the gate card.
;
; Separate project on purpose: the previous firmware accumulated a card store, a
; keyboard reader, SD mounting and a full-screen sprite around the emulation, and
; each of those was a suspect for "the phone sees it but the gate reader does not".
; This build has none of them -- it is M5Unit-NFC's own NFCA/Emulation example with
; the captured card identity in place of the demo tag.
;
;   pio run -t upload --upload-port COM10
;
; Verified before this rewrite: the vendor example, unchanged, is read by a phone
; and produces a reaction at the gate reader; with the captured UID and the
; captured ATQA/SAK it opens the gate.
[env:retry-emu]
platform = espressif32@6.13.0
board = cardputer_adv
framework = arduino
boards_dir = boards

board_build.partitions = default_8MB.csv
monitor_speed = 115200

; M5_LOG_LEVEL=1 keeps the layer's "CMD:%02X" error line, which is the only
; library output worth having: it fires when a reader sends a command the
; emulation cannot answer (0x60/0x61 = MIFARE AUTH).
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DUSING_CAP_CC1101
    -DM5_LOG_LEVEL=1

lib_deps =
    m5stack/M5Cardputer@^1.1.1
    m5stack/M5UnitUnified@0.6.4
    m5stack/M5Unit-NFC@0.1.2