; PlatformIO project for M5Stack Cardputer ADV + CAP.CC1101
; 315 / 433 / 868 MHz OOK capture and replay.
;
;   pio run -t upload              build and flash the capture application
;   pio run -e example -t upload   official M5Stack receiver example (RadioLib)
;   tools/run-device.ps1           build + flash + reset + serial log

[platformio]
default_envs = cardputer-adv
boards_dir = boards

[env:cardputer-adv]
; Pinned on purpose.  6.13.0 is the last release on Arduino core 2.x / ESP-IDF
; 4.4, which is what this firmware was developed and verified against.  The
; 8.x line moves to Arduino core 3.x / ESP-IDF 5.x, where this board's custom
; definition (variant m5stack_stamp_s3) does not come up on real hardware -
; the display stays dark and the USB CDC never answers.  The legacy RMT API
; also changed there (rmt_set_pin was removed, see src/ook_rx.cpp).
; Do not bump this without testing on a real Cardputer ADV.
platform = espressif32@6.13.0
board = cardputer_adv
framework = arduino

board_build.partitions = default_8MB.csv
build_src_filter = +<*> -<example.cpp>

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-unused-variable

lib_deps =
    m5stack/M5Cardputer@^1.1.1

; Same firmware with the serial diagnostics and the 1 Hz forced redraw compiled
; out.  This is the experiment described in docs/DEV-STATE.md section 4: if the
; keyboard still dies in this build, the freeze was never a redraw problem and
; the 1 Hz tick was masking it.  Flash with:
;   pio run -e diag-off -t upload
[env:diag-off]
extends = env:cardputer-adv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-unused-variable
    -DRF_DIAG=0

; Official M5Stack example, kept side by side for hardware verification.
[env:example]
extends = env:cardputer-adv
build_src_filter = +<*> -<main.cpp>
lib_deps =
    ${env:cardputer-adv.lib_deps}
    https://github.com/jgromes/RadioLib.git
