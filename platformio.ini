; PlatformIO project for M5Stack Cardputer ADV + CAP.CC1101
; 315 / 433 / 868 MHz OOK capture and replay.
;
;   pio run -t upload              build and flash the capture application
;   pio run -e example -t upload   official M5Stack receiver example (RadioLib)
;   tools/run-device.ps1           build + flash + reset + serial log

[platformio]
default_envs = cardputer-adv
boards_dir = boards

[env:cardputer-adv]
; Pinned on purpose.  6.13.0 is the last release on Arduino core 2.x / ESP-IDF
; 4.4, which is what this firmware was developed and verified against.  The
; 8.x line moves to Arduino core 3.x / ESP-IDF 5.x, where this board's custom
; definition (variant m5stack_stamp_s3) does not come up on real hardware -
; the display stays dark and the USB CDC never answers.  The legacy RMT API
; also changed there (rmt_set_pin was removed, see src/ook_rx.cpp).
; Do not bump this without testing on a real Cardputer ADV.
platform = espressif32@6.13.0
board = cardputer_adv
framework = arduino

board_build.partitions = default_8MB.csv
build_src_filter = +<*> -<example.cpp>

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-unused-variable

; The NFC feature (src/nfc_app.cpp) is compiled into this firmware too, so the
; NFC stack is a hard dependency of the shipping build now, not just of the NFC
; environments.
lib_deps =
    m5stack/M5Cardputer@^1.1.1
    m5stack/M5UnitUnified@0.6.4
    m5stack/M5Unit-NFC@0.1.2

; Same firmware with the serial diagnostics and the 1 Hz forced redraw compiled
; out.  This is the experiment described in docs/DEV-STATE.md section 4: if the
; keyboard still dies in this build, the freeze was never a redraw problem and
; the 1 Hz tick was masking it.  Flash with:
;   pio run -e diag-off -t upload
[env:diag-off]
extends = env:cardputer-adv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-unused-variable
    -DRF_DIAG=0

; Dependency spike for the planned NFC app (docs/DEV-STATE.md section 12).
; Answers one question only: do M5Unit-NFC + M5UnitUnified coexist with
; M5Cardputer@1.1.1 under espressif32@6.13.0?  M5's own Cap-CC1101 +
; Cardputer-ADV examples build against espressif32@6.12.0, one minor below the
; pin this project cannot move off, so this is proven rather than assumed.
; Builds src/nfc_spike.cpp alone; the shipping environments never define
; RF_NFC_SPIKE, so for them that file is an empty translation unit.
;
; M5_LOG_LEVEL=5 turns on the M5 libraries' verbose log while CORE_DEBUG_LEVEL
; stays 0.  NFCLayerA::detect() logs the ATQA at verbose level, which is the
; only way to tell "no card in the field" from "anti-collision failed" -- both
; come back as the same false.  This does not flood: unit_ST25R3916.hpp has
; zero verbose log sites, so the hot SPI/transceive path stays silent.
;   pio run -e nfc-spike -t upload
[env:nfc-spike]
extends = env:cardputer-adv
build_src_filter = +<nfc_spike.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-unused-variable
    -DRF_NFC_SPIKE=1
    -DUSING_CAP_CC1101
    -DM5_LOG_LEVEL=5
lib_deps =
    m5stack/M5Cardputer@^1.1.1
    m5stack/M5UnitUnified@0.6.4
    m5stack/M5Unit-NFC@0.1.2

; Replay spike: reads the cards nfc-spike captured out of /nfc/capture.log and
; presents one of them to a reader.  Answers whether a door accepts a replayed
; UID or demands crypto1 authentication, which is the question that decides
; whether "copy a card" is a feature or a dead end.  See the header comment in
; src/nfc_emu.cpp for the two library boundaries it works around.
;
; cfg.emulation is set before Units.begin() and reader/emulator are mutually
; exclusive configurations of the same ST25R3916, so this env and nfc-spike
; cannot be merged -- switching between them means reflashing.
;
; M5_LOG_LEVEL stays at 1 (Error) rather than the 5 nfc-spike uses.  Emulation
; has to answer a reader within a few hundred microseconds and any log output
; during a session can make it miss that window, so the only library output
; wanted here is the "CMD:%02X" error that receive_callback emits for a command
; it does not handle -- which is precisely the AUTH this build is looking for.
;
; M5_UNIT_NFC_EMULATION_TRACE turns on the library's own state trace
; (nfc/layer/emulation_trace.hpp).  It records to RAM and dumps itself from
; goto_off(), i.e. once the field is gone, so it costs nothing mid-session and
; shows the OFF/IDLE/READY/ACTIVE/HALT path a reader actually took.
;   pio run -e nfc-emu -t upload
[env:nfc-emu]
extends = env:cardputer-adv
build_src_filter = +<nfc_emu.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-unused-variable
    -DRF_NFC_EMULATE=1
    -DUSING_CAP_CC1101
    -DM5_LOG_LEVEL=1
    -DM5_UNIT_NFC_EMULATION_TRACE=1
lib_deps =
    m5stack/M5Cardputer@^1.1.1
    m5stack/M5UnitUnified@0.6.4
    m5stack/M5Unit-NFC@0.1.2

; Vendor emulation example, compiled as-is.  Baseline for "is it the hardware or
; is it our code": M5Unit-NFC's own NFCA/Emulation example with the button demo
; removed.  Flash it, then put a phone on the module -- if the phone reads a
; "M5Stack" NDEF tag, the module and library can emulate fine.
;   pio run -e nfc-example -t upload
[env:nfc-example]
extends = env:cardputer-adv
build_src_filter = +<nfc_example.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-unused-variable
    -DRF_NFC_EXAMPLE=1
    -DUSING_CAP_CC1101
    -DM5_LOG_LEVEL=1
lib_deps =
    m5stack/M5Cardputer@^1.1.1
    m5stack/M5UnitUnified@0.6.4
    m5stack/M5Unit-NFC@0.1.2

; Official M5Stack example, kept side by side for hardware verification.
[env:example]
extends = env:cardputer-adv
build_src_filter = +<*> -<main.cpp>
lib_deps =
    ${env:cardputer-adv.lib_deps}
    https://github.com/jgromes/RadioLib.git
