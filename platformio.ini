; PlatformIO project for M5Stack Cardputer ADV + CAP.CC1101
; 315 / 433 / 868 MHz OOK capture and replay.
;
;   pio run -t upload              build and flash the capture application
;   pio run -e example -t upload   official M5Stack receiver example (RadioLib)
;   tools/run-device.ps1           build + flash + reset + serial log

[platformio]
default_envs = cardputer-adv
boards_dir = boards

[env:cardputer-adv]
; Pinned on purpose.  6.13.0 is the last release on Arduino core 2.x / ESP-IDF
; 4.4, which is what this firmware was developed and verified against.  The
; 8.x line moves to Arduino core 3.x / ESP-IDF 5.x, where this board's custom
; definition (variant m5stack_stamp_s3) does not come up on real hardware -
; the display stays dark and the USB CDC never answers.  The legacy RMT API
; also changed there (rmt_set_pin was removed, see src/ook_rx.cpp).
; Do not bump this without testing on a real Cardputer ADV.
platform = espressif32@6.13.0
board = cardputer_adv
framework = arduino

board_build.partitions = default_8MB.csv
; IR TOOLS is deliberately not part of this build: its six sources stay in src/
; (and its host tests in tests/host/) but are not compiled, because the feature is
; unverified against real hardware.  `pio run -e cardputer-ir` puts it back --
; see ir_config.h.  RF LAB is inside RF TOOLS now, not a top-level entry.
build_src_filter =
    +<*>
    -<example.cpp>
    -<ir_app.cpp>
    -<ir_protocol.cpp>
    -<ir_tx.cpp>
    -<ir_rx.cpp>
    -<ir_store.cpp>
    -<ir_file.cpp>

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; USB keyboard support needs the OTG/TinyUSB stack, not the hardware CDC/JTAG
; stack.  ESP32-S3 has one USB PHY, so this is a whole-firmware choice:
;   mode 0: TinyUSB CDC + HID (+ MSC only when USB DISK app is selected)
;   mode 1: hardware CDC/JTAG (old behaviour, no USB HID)
; CDC_ON_BOOT is 0 so the core does not start USB before setup(); the selected
; app registers its interfaces first, then main calls USB.begin().
; The board definition supplies -DARDUINO_USB_MODE=1 and
; -DARDUINO_USB_CDC_ON_BOOT=1; both are removed here and redefined below --
; overriding without removing made every compile emit "redefined" warnings.
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; SSH Ed25519 key auth is kept in the source but disabled in the shipping
; firmware.  Set SSH_ENABLE_ED25519=1 in build_flags to re-enable the TF import
; (`K`), AUTH row and key auth path.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-unused-variable
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCONFIG_TINYUSB_MSC_ENABLED=1
    -DSSH_ENABLE_ED25519=0
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

; The NFC feature (src/nfc_app.cpp) is compiled into this firmware too, so the
; NFC stack is a hard dependency of the shipping build now, not just of the NFC
; environments.
lib_deps =
    m5stack/M5Cardputer@^1.1.1
    m5stack/M5UnitUnified@0.6.4
    m5stack/M5Unit-NFC@0.1.2
    bblanchon/ArduinoJson@^7.4.2
    ; Pinned LibSSH-ESP32 (libssh port, LGPL-2.1).  Tag 5.10.0 is the
    ; version whose README explicitly lists Arduino core 2.0.17 / ESP32-S3.
    https://github.com/ewpa/LibSSH-ESP32/archive/refs/tags/5.10.0.zip

; Same firmware with the serial diagnostics and the 1 Hz forced redraw compiled
; out.  This is the experiment described in docs/DEV-STATE.md section 4: if the
; keyboard still dies in this build, the freeze was never a redraw problem and
; the 1 Hz tick was masking it.  Flash with:
;   pio run -e diag-off -t upload
[env:diag-off]
extends = env:cardputer-adv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-unused-variable
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DRF_DIAG=0
    -DCONFIG_TINYUSB_MSC_ENABLED=1
    -DSSH_ENABLE_ED25519=0

; HARNESS bring-up build: cold boot lands in HARNESS so the WS plugin can be
; verified without touching the device.  Not for shipping.
;   pio run -e harness-selftest -t upload --upload-port COM13
[env:harness-selftest]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DHARNESS_BOOT_SELFTEST=1

; Official M5Stack example, kept side by side for hardware verification.
; It defines its own setup()/loop(), so it must be the ONLY source in this
; environment -- every other app in src/ also defines them and the old
; "+<*> -<main.cpp>" filter linked all of them together (multiple-definition
; failure).  It needs no extra lib_deps beyond the inherited ones.
[env:example]
extends = env:cardputer-adv
build_src_filter = +<example.cpp>

; IR TOOLS back in the build, behind the launcher entry it normally occupies.
; Same firmware, one define and the six src/ir_*.cpp files:
;   pio run -e cardputer-ir -t upload
[env:cardputer-ir]
extends = env:cardputer-adv
build_src_filter = +<*> -<example.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-unused-variable
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCONFIG_TINYUSB_MSC_ENABLED=1
    -DSSH_ENABLE_ED25519=0
    -DENABLE_IR_TOOLS=1

; IR bring-up build.  Same firmware with -DIR_BOOT_SELFTEST=1 (src/ir_config.h):
; every reset lands in IR TOOLS and the app fires six 200 ms carrier bursts over
; the first ~10 s.  That makes the one thing that cannot be checked from a host
; test -- "does the LED really light up, and does the RMT carrier path survive
; init on real silicon" -- observable with nothing but the USB serial log and a
; phone camera.  Not for shipping: it skips the chooser.
;   pio run -e ir-selftest -t upload
[env:ir-selftest]
extends = env:cardputer-ir
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-unused-variable
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCONFIG_TINYUSB_MSC_ENABLED=1
    -DSSH_ENABLE_ED25519=0
    -DENABLE_IR_TOOLS=1
    -DIR_BOOT_SELFTEST=1

; Wireless upload.  The device must already be running firmware with the
; SETTINGS -> OTA UPDATE page and be sitting on that page (ArduinoOTA server).
; First flash still uses env:cardputer-adv over USB.  OTA auth is a
; per-device password generated on first use and shown on that page
; (NVS "ota"/"pass"); replace the placeholder below with the value from the
; device screen before uploading.  Override the address when mDNS does not
; resolve:
;   pio run -e cardputer-ota -t upload --upload-port 192.168.1.42
[env:cardputer-ota]
extends = env:cardputer-adv
upload_protocol = espota
upload_port = cardputer.local
upload_flags = --auth=READ_FROM_DEVICE_SCREEN
lib_deps =
    ${env:cardputer-adv.lib_deps}
    https://github.com/jgromes/RadioLib.git
